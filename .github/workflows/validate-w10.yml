# CI validate manifest (W10). Path khop voi cau truc repo W10.
name: validate-w10
on:
  pull_request:
    paths:
    - 'cloud/w10/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install kubeconform
      run: |
        curl -sSLo kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
        tar -xzf kc.tgz
        sudo mv kubeconform /usr/local/bin/

    # -ignore-missing-schemas: bo qua CRD chua biet schema (Rollout, Application,
    # ServiceMonitor, PrometheusRule, AnalysisTemplate, Constraint, ExternalSecret...)
    - name: Validate manifests
      run: |
        kubeconform -strict -summary -ignore-missing-schemas \
          cloud/w10/lab1/app-api/ \
          cloud/w10/lab1/app-analysis/ \
          cloud/w10/lab1/app-alert/ \
          cloud/w10/lab1/app-common/ \
          cloud/w10/argocd/ \
          cloud/w10/lab1/rbac/ \
          cloud/w10/lab1/gatekeeper/constraints/ \
          cloud/w10/lab2/eso/ \
          cloud/w10/lab2/policies/


