apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app-argocd-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/G-03-XBrain-Phase-2/huyvlt-aws-accelerator-p2.git
    targetRevision: main
    path: cloud/w9/gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
